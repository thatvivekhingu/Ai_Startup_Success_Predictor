name: Daily Gujarat Startup News Digest

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (Indian Standard Time: UTC+5:30)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gujarat_startup_notifier/requirements.txt

      - name: Restore News Deduplication Cache
        uses: actions/cache@v4
        with:
          path: gujarat_startup_notifier/news_cache.db
          key: gujarat-news-cache-${{ github.run_id }}
          restore-keys: |
            gujarat-news-cache-

      - name: Execute News Scraper & Notifier
        env:
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL || 'false' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          cd gujarat_startup_notifier
          python main.py --now
